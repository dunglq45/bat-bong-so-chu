<div class="scene">
  <div class="scene__sky">
    <div class="cloud cloud--1"></div>
    <div class="cloud cloud--2"></div>
    <div class="sun"></div>

    <form class="card" (submit)="$event.preventDefault(); continue()">
      <app-mascot variant="wave" [size]="120" [bounce]="true" />

      <h1 class="card__title">{{ hasExistingName() ? 'Đổi tên bé' : 'Bé tên là gì?' }}</h1>
      <p class="card__sub">Nhập tên để trò chơi gọi bé trong suốt hành trình nhé!</p>

      <label class="visually-hidden" for="child-name">Tên của bé</label>
      <input
        #nameInput
        id="child-name"
        class="name-input"
        type="text"
        autocomplete="given-name"
        maxlength="24"
        placeholder="Nhập tên của bé"
        [value]="name()"
        (input)="onInput($event)"
      />

      <button type="submit" class="btn-candy continue-btn" [disabled]="!canContinue">
        <app-icon name="play" [size]="26" />
        <span>Bắt đầu</span>
      </button>
    </form>
  </div>

  <div class="scene__hill"></div>
</div>
